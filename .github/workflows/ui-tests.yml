name: UI lint and tests

on:
  pull_request:
    paths:
      - "apps/ui/**"
      - "packages/shared/deployment/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-nuc.yml"
      - "scripts/verify-deploy-health.mjs"
      - "scripts/verify-deploy-health.test.mjs"
      - "scripts/ab-auth-prod.sh"
      - "scripts/ab-auth-prod.test.mjs"
      - "scripts/lib/bounded-command.mjs"
      - "scripts/lib/revoke-prod-qa-session.sh"
      - "scripts/lib/run-sanitized-agent-browser.sh"
      - "scripts/lib/wait-for-prod-qa-surface.mjs"
      - ".github/workflows/ui-tests.yml"
  push:
    branches: [main, master]
    paths:
      - "apps/ui/**"
      - "packages/shared/deployment/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-nuc.yml"
      - "scripts/verify-deploy-health.mjs"
      - "scripts/verify-deploy-health.test.mjs"
      - "scripts/ab-auth-prod.sh"
      - "scripts/ab-auth-prod.test.mjs"
      - "scripts/lib/bounded-command.mjs"
      - "scripts/lib/revoke-prod-qa-session.sh"
      - "scripts/lib/run-sanitized-agent-browser.sh"
      - "scripts/lib/wait-for-prod-qa-surface.mjs"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI dependencies
        run: npm ci
        working-directory: apps/ui

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/ui

      - name: Lint UI
        run: npm run lint
        working-directory: apps/ui

      - name: Typecheck UI
        run: npm run typecheck
        working-directory: apps/ui

      - name: Run UI tests
        run: npm test
        working-directory: apps/ui

      - name: Test deploy health verifier
        run: node --test scripts/verify-deploy-health.test.mjs

      - name: Test bounded production QA wrapper
        run: node --test scripts/ab-auth-prod.test.mjs

      - name: Run platform API smoke
        run: npm run test:platform
        working-directory: apps/ui

      - name: Run UI e2e smoke
        run: npm run test:e2e
        working-directory: apps/ui
