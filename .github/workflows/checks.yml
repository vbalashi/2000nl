name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Test browser profile selection
        working-directory: .
        run: node --test scripts/ci/browser-profile.test.mjs
      - name: Verify inherited database postflight checks
        working-directory: .
        run: node --test db/scripts/generate_known_postflight.test.mjs
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run i18n:check-registration
      - run: npm run check:interface-standard
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify isolated SMTP delivery
        working-directory: .
        run: scripts/test-notification-smtp.sh
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fsrs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/ui
      - name: Disable JIT for deterministic SQL tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fsrs_test -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM SET jit = off'
          psql -h localhost -U postgres -d fsrs_test -v ON_ERROR_STOP=1 -c 'SELECT pg_reload_conf()'
      - run: npm run test:database
        working-directory: apps/ui
        env:
          FSRS_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/fsrs_test
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Choose conservative browser profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          base="$BEFORE"
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then base="$PR_BASE"; fi
          # Run the selector from the trusted base, never the proposed change.
          # If absent/invalid/non-ancestor, keep the full suite.
          profile=full
          if [[ "$base" =~ ^[a-f0-9]{40}$ ]] && git show "$base:scripts/ci/browser-profile.mjs" > "$RUNNER_TEMP/browser-profile.mjs" 2>/dev/null; then
            profile=$(node "$RUNNER_TEMP/browser-profile.mjs" "$base" "$HEAD") || profile=full
          fi
          [[ "$profile" == 'release' || "$profile" == 'full' ]] || profile=full
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Browser profile: $profile"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - if: steps.profile.outputs.profile == 'release'
        run: npx playwright test playwright/tests/release-updates.spec.ts
      - if: steps.profile.outputs.profile == 'full'
        run: npm run test:e2e:received-groups
      - if: steps.profile.outputs.profile == 'full'
        run: npm run test:e2e
      - if: steps.profile.outputs.profile == 'full'
        run: npm run test:e2e:i18n
      - if: steps.profile.outputs.profile == 'full'
        run: npm run test:e2e:training-reliability
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-diagnostics
          path: apps/ui/test-results
          retention-days: 7
  importer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r packages/ingestion/requirements.txt
      - run: python -m pytest packages/ingestion/tests
  real-supabase-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.101.0
      - run: npm ci
        working-directory: apps/ui
      - run: npx playwright install --with-deps chromium
        working-directory: apps/ui
      - run: python3 -m unittest discover -s scripts/ci -p smoke_docker_guard_test.py
      - run: scripts/ci/real-supabase-smoke.py
