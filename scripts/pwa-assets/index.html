<!doctype html><html lang="ru"><meta charset="utf-8"><title>2000nl — иконка</title><style>
@font-face{font-family:Inter;src:url('./fonts/inter-latin.woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#f4f4f3;color:#303033;font-family:Inter,system-ui,sans-serif;padding:56px}h1{font-size:52px;font-weight:400;letter-spacing:-.045em;margin:0}h1 span{color:#71608d}p{color:#777782;font-size:14px}nav{margin:0 0 36px}a{color:#71608d}.grid{display:flex;gap:32px;flex-wrap:wrap;margin:44px 0}.sample{text-align:center}.sample img{width:160px;height:160px;display:block}.circle{border-radius:50%}.iphone{border-radius:23%}.squircle{border-radius:32%}.square{border-radius:10%}.small img{width:56px;height:56px}.tiny img{width:40px;height:40px}.themed{filter:sepia(1)}button{border:1px solid #cbc8ce;background:white;border-radius:8px;padding:9px 16px;font:inherit;color:#71608d;cursor:pointer}canvas{display:none}hr{border:0;border-top:1px solid #dedde0;margin:40px 0}footer{font-size:12px;color:#777782;max-width:600px;line-height:1.5}@media(max-width:700px){body{padding:30px}.grid{gap:24px}.sample img{width:112px;height:112px}.small img{width:56px;height:56px}.tiny img{width:40px;height:40px}}
</style><nav><a href="/">← Экран запуска</a></nav><h1>2000<span>nl</span></h1><p>Один знак. Разные системные маски.</p><div class="grid" id="masks"></div><hr><p>На рабочем столе</p><div class="grid" id="small"></div><footer>Форма применяется системой. Здесь показаны варианты обрезки исходника, а не точная имитация всех версий Android и iOS. Цветная иконка имеет постоянную палитру; экран запуска использует настройку профиля.</footer><div id="assets"></div><script type="module">
await document.fonts.load('500 100px Inter');
function draw(name,w,h,mono=false,splash=false){const c=document.createElement('canvas');c.width=w;c.height=h;c.dataset.asset=name;document.querySelector('#assets').append(c);const x=c.getContext('2d');if(!mono){x.fillStyle='#202124';x.fillRect(0,0,w,h)}x.textBaseline='middle';const scale=splash?w/(w>=1620?834: w===828?414: w/3):512;let size=splash?52*(w>=1620?2:w===828?2:3):132*(w/512);x.font=`${splash?400:500} ${size}px Inter`;let a=x.measureText('2000').width,b=x.measureText('nl').width;const left=(w-a-b)/2, y=h/2-(splash?30*(w>=1620?2:w===828?2:3):0);x.fillStyle=mono?'white':'#e6e6e5';x.fillText('2000',left,y);x.fillStyle=mono?'white':'#c2a8e2';x.fillText('nl',left+a,y);const exportImg=new Image;exportImg.dataset.export=name;exportImg.src=c.toDataURL();exportImg.style.display='none';document.querySelector('#assets').append(exportImg);return c}
const icon=draw('icon-512-v2.png',512,512);draw('icon-512-maskable-v2.png',512,512);draw('icon-192-v2.png',192,192);draw('apple-touch-icon-v2.png',180,180);draw('icon-monochrome-v2.png',512,512,true);
for(const [w,h] of [[1290,2796],[1179,2556],[1284,2778],[1170,2532],[1125,2436],[1242,2688],[828,1792],[2048,2732],[1668,2388],[1620,2160]])draw(`apple-touch-startup-image-${w}x${h}-v2.png`,w,h,false,true);
for(const [className,label] of [['circle','Pixel · круг'],['iphone','iPhone'],['squircle','Squircle'],['square','Скруглённый квадрат']]){const d=document.createElement('div');d.className='sample';const i=new Image;i.src=icon.toDataURL();i.className=className;d.append(i);const p=document.createElement('p');p.textContent=label;d.append(p);document.querySelector('#masks').append(d)}
for(const [size,cl] of [[56,'small'],[40,'tiny']]){const d=document.createElement('div');d.className=`sample ${cl}`;const i=new Image;i.src=icon.toDataURL();i.className='circle';d.append(i);const p=document.createElement('p');p.textContent=size+' px';d.append(p);document.querySelector('#small').append(d)}
document.body.dataset.ready='true';
</script></html>
