<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training — варианты A/B/C</title><style>
:root{--practice-text:#313b53;--practice-text-secondary:#514e65;--practice-text-muted:#70647f;--practice-border:#ddd5eb;--practice-canvas:#f3f3f9;--practice-hero:#ebe5f3;--practice-hero-end:#f0edf5;--practice-surface:#fff;--practice-surface-subtle:#ebe6f3;--practice-surface-hover:#e2d9ed;--practice-accent:#71608c;--practice-on-accent:#fff;--practice-font-reading:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--practice-canvas);font-family:Arial,sans-serif;color:var(--practice-text)}header{height:60px;display:flex;align-items:center;padding:0 24px;justify-content:space-between}header strong{font-size:24px;font-weight:400}header span{font-size:12px;color:var(--practice-text-muted)}main{padding:20px 16px 12px}footer{position:fixed;bottom:0;left:0;right:0;height:58px;display:flex;justify-content:space-around;align-items:center;background:var(--practice-canvas);border-top:1px solid var(--practice-border);font-size:13px}
.workspace{height:100%;min-height:0;max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;color:var(--practice-text);--preview-bg:var(--practice-canvas);background:var(--preview-bg);font-family:inherit}
.hero{flex:none;position:relative;border:1px solid var(--practice-border);border-radius:20px;padding:20px 24px;background:linear-gradient(120deg,var(--practice-hero),var(--practice-hero-end));display:grid;gap:15px}
.top{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:1.6px;color:var(--practice-text-muted)}
.workspace button{font:inherit;cursor:pointer}.top button,.savedTitle button{border:0;background:none;color:var(--practice-text-muted)}
.title h2{font-family:var(--practice-font-reading);font-weight:500;font-size:36px;line-height:1.1;margin:0 0 8px}.title p,.row p{font-size:12px;color:var(--practice-text-muted);margin:0;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metrics>div{display:flex;flex-direction:column;gap:6px}.metrics strong{font-size:29px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}.metrics span{font-size:12px;color:var(--practice-text-muted)}
.start{border:0;border-radius:11px;display:flex;gap:10px;align-items:center;justify-content:center;min-height:44px;padding:10px 22px;color:var(--practice-on-accent);background:var(--practice-accent);justify-self:start;font-size:14px!important}
.saved{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}.savedTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 9px}.savedTitle h3{font-size:14px;font-weight:500;margin:0}.savedTitle button{font-size:12px!important}.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:30px}.scroll::-webkit-scrollbar{display:none}.row{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:15px 8px;border-bottom:1px solid var(--practice-border)}.row h4{font-size:15px;font-weight:500;margin:0 0 4px}.row>button{border:1px solid var(--practice-border);border-radius:9px;padding:8px 12px;background:var(--practice-surface);color:var(--practice-text-secondary);font-size:12px!important}.selected{background:var(--practice-surface-subtle);border-radius:10px}.row>div{min-width:0}.fade{position:absolute;bottom:0;left:0;right:0;height:44px;background:linear-gradient(transparent,var(--preview-bg));display:flex;align-items:flex-end;justify-content:center;pointer-events:none}.fade button{pointer-events:auto;border:0;background:none;color:var(--practice-text-muted);height:26px}.empty{padding:34px 8px;color:var(--practice-text-secondary);font-size:14px;line-height:1.8}.empty span{color:var(--practice-text-muted);font-size:12px}
.B .hero{grid-template-columns:1fr auto;gap:12px 22px}.B .top{grid-column:1/-1}.B .title{grid-column:1}.B .metrics{grid-column:1}.B .start{grid-column:2;grid-row:2/4;align-self:center}.B .title h2{font-size:30px}.B .metrics strong{font-size:25px}
.C .hero{background:var(--practice-surface-subtle);gap:10px;padding:16px 22px}.C .top{position:absolute;right:14px;top:12px}.C .top>span{display:none}.C .title h2{font-size:28px;margin-right:28px}.C .metrics{border-top:1px solid var(--practice-border);padding-top:12px;grid-template-columns:repeat(3,1fr)}.C .metrics>div{flex-direction:row;align-items:baseline;gap:7px}.C .metrics strong{font-size:24px}.C .metrics span{font-size:11px}.C .start{position:absolute;right:20px;top:64px;min-height:36px;padding:8px 16px}.C .title p{padding-right:160px}
.wave{position:relative;border-radius:7px;color:transparent;overflow:hidden;background:var(--practice-surface-hover)}.wave:after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(100deg,transparent,var(--practice-border),transparent);animation:wave 1.7s ease-in-out infinite}@keyframes wave{to{transform:translateX(100%)}}
.switcher{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:#252331;color:#fff;font-size:10px;z-index:100;white-space:nowrap;box-shadow:0 3px 14px #0002}.switcher button{border:0;background:#ffffff18;color:white;border-radius:5px;padding:5px;display:flex;align-items:center;font-size:10px!important}
.dark{--preview-bg:#22212b;--practice-canvas:#22212b;--practice-text:#eeeaf7;--practice-text-secondary:#d2cbde;--practice-text-muted:#aaa0bf;--practice-border:#4f475f;--practice-hero:#383044;--practice-hero-end:#292631;--practice-surface:#302b39;--practice-surface-subtle:#302b39;--practice-surface-hover:#42394f;--practice-accent:#bca6e0;--practice-on-accent:#272132}
@media(max-width:500px){.workspace{gap:17px}.hero{padding:16px 18px;gap:13px}.title h2{font-size:29px}.metrics strong{font-size:27px}.metrics span{font-size:11px}.start{width:100%;justify-self:stretch}.B .hero{grid-template-columns:1fr}.B .metrics,.B .title,.B .start{grid-column:1;grid-row:auto}.B .metrics strong{font-size:23px}.B .title h2{font-size:25px}.B .hero{gap:11px}.C .start{position:static;min-height:38px}.C .title p{padding-right:0}.C .metrics>div{flex-direction:column;gap:3px}.C .hero{padding:13px 17px;gap:8px}.row{padding:13px 6px}.switcher{bottom:64px;gap:3px;padding:6px}.switcher span{font-size:9px}}
@media(prefers-reduced-motion:reduce){.wave:after{animation:none;transform:none;opacity:.4}}
.workspace{height:calc(100dvh - 195px)}
@media(min-width:768px){.workspace{height:calc(100dvh - 155px)}}
</style><header><strong>2000nl</strong><span>Training · Library · Statistics</span></header><main><div id="workspace" class="workspace A"><section class="hero"><div class="top"><span>DUTCH</span><button aria-label="Настройка">☷</button></div><div class="title"><h2 id="title">Translation</h2><p>Translation · Reviews only · Up to 5 cards</p></div><div class="metrics" id="metrics"><div><strong>0</strong><span>Due today</span></div><div><strong>142</strong><span>Total reviews</span></div><div><strong>286</strong><span>Still to learn</span></div></div><button class="start" id="start">▷ Review ahead</button></section><section class="saved"><div class="savedTitle"><h3>Saved Trainings</h3><button>＋ Create training</button></div><div class="scroll" id="list"></div><div class="fade" id="fade"><button aria-label="Дальше">⌄</button></div></section><div class="switcher"><button id="prev">‹</button><span id="variantLabel">A · Prototype · Sample counts</span><button id="next">›</button><button id="emptyToggle">No saved</button><button id="theme">Theme</button></div></div></main><footer><span>▷ Training</span><span>▥ Library</span><span>▥ Statistics</span></footer><script>
const box=document.getElementById('workspace'),list=document.getElementById('list'),metrics=document.getElementById('metrics'),fade=document.getElementById('fade');let variant=new URL(location.href).searchParams.get('variant')||'A',selected=0,empty=false,timer;
const names=['Translation','Idioms','VanDale 2k','Risk Training'];
function drawList(){list.innerHTML=empty?'<div class="empty">No saved trainings yet.<br><span>Create a training to keep its settings here.</span></div>':Array.from({length:100},(_,i)=>`<div class="row ${selected===i?'selected':''}" data-id="${i}"><div><h4>${names[i%4]} ${i+1}</h4><p>Dutch · Reviews only · Up to 5 cards</p></div><button data-load="${i}">${selected===i?'Selected':'Load'}</button></div>`).join('');fade.hidden=empty}
function choose(i){selected=i;clearTimeout(timer);document.getElementById('title').textContent=names[i%4]+' '+(i+1);metrics.querySelectorAll('strong').forEach(el=>{el.textContent='—';el.classList.add('wave')});list.querySelectorAll('.row').forEach(el=>{el.classList.toggle('selected',+el.dataset.id===i);el.querySelector('button').textContent=+el.dataset.id===i?'Selected':'Load'});timer=setTimeout(()=>{const vals=i%3===0?[0,142,286]:[12+i,142+i*3,286-i];metrics.querySelectorAll('strong').forEach((el,j)=>{el.textContent=vals[j];el.classList.remove('wave')});document.getElementById('start').textContent=vals[0]===0?'▷ Review ahead':'▷ Start training'},1100)}
list.addEventListener('click',e=>{const b=e.target.closest('[data-load]');if(b)choose(+b.dataset.load)});list.addEventListener('scroll',()=>fade.style.visibility=list.scrollTop+list.clientHeight>=list.scrollHeight-3?'hidden':'visible');fade.querySelector('button').onclick=()=>list.scrollBy({top:200,behavior:'smooth'});
function apply(){box.classList.remove('A','B','C');box.classList.add(variant);document.getElementById('variantLabel').textContent=variant+' · Prototype · Sample counts';const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u)}function cycle(n){variant='ABC'[('ABC'.indexOf(variant)+n+3)%3];apply()}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('emptyToggle').onclick=()=>{empty=!empty;document.getElementById('emptyToggle').textContent=empty?'100 saved':'No saved';drawList()};document.getElementById('theme').onclick=()=>box.classList.toggle('dark');document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});drawList();apply();
</script></html>
