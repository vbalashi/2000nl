<div id="nl-controls-lab">
  <div class="lab-toolbar"><label>Тема <select id="lab-theme"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label><button class="btn" type="button" id="lab-copy">Скопировать настройки</button></div>
  <textarea id="lab-export" class="form-control" aria-label="Настройки для копирования" readonly hidden></textarea>
  <div class="lab-product" data-theme="light"><div id="lab-rows"></div><output id="lab-status" aria-live="polite"></output></div>
</div>
<style>
#nl-controls-lab{font-family:Inter,system-ui,sans-serif;color:var(--foreground)}
#nl-controls-lab .lab-toolbar{display:flex;gap:12px;flex-wrap:wrap;padding:0 90px 16px 0}
#nl-controls-lab #lab-export{width:100%;box-sizing:border-box;min-height:160px;margin-bottom:16px}
#nl-controls-lab .has-picker{display:flex;align-items:center;gap:3px}
#nl-controls-lab .picker-trigger{height:var(--picker-height,28px);min-width:28px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--p-muted);padding:0 5px}
#nl-controls-lab .picker-trigger[aria-expanded=true]{color:var(--p-text)}
#nl-controls-lab .picker-trigger i{display:block;width:16px;height:16px}
#nl-controls-lab .capsule.transparent{background:transparent}
#nl-controls-lab .capsule.transparent .selection-ink{background:var(--p-group)}
#nl-controls-lab .library-actions{display:flex;gap:8px;flex-wrap:wrap}
#nl-controls-lab .library-actions button{box-sizing:border-box;height:28px;padding:0 10px;border:1px solid transparent;border-radius:var(--control-r);background:transparent;color:var(--p-text);font:inherit;font-size:13px}
#nl-controls-lab .library-actions.filled button{background:var(--p-group)}
#nl-controls-lab .library-actions.bordered button{border-color:var(--p-line)}
#nl-controls-lab .library-actions{width:240px}
#nl-controls-lab .library-actions button:first-child{width:100%;background:var(--p-group)}
#nl-controls-lab .library-actions button:last-child{margin-left:auto}
#nl-controls-lab .lab-product{--p-bg:#f5f4fb;--p-text:#252547;--p-muted:#55557a;--p-line:#aaa5c8;--p-group:#ebeafa;--p-active:#fff;--p-accent:#4e3fd1;--p-on:#fff;--p-focus:#7753b0;background:var(--p-bg);color:var(--p-text);padding:20px;border-radius:16px;color-scheme:light}
#nl-controls-lab .lab-product[data-theme=dark]{--p-bg:#18172c;--p-text:#eef2ff;--p-muted:#a5b4fc;--p-line:#5c5489;--p-group:#292644;--p-active:#423969;--p-accent:#8e81f4;--p-on:#18172c;--p-focus:#b6a6f8;color-scheme:dark}
#nl-controls-lab .lab-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 22px;padding:18px 0;border-bottom:1px solid var(--p-group);align-items:center}
#nl-controls-lab .row-label{font-size:13px;font-weight:500;margin-bottom:10px}
#nl-controls-lab .row-example{position:relative;max-width:100%;width:fit-content}
#nl-controls-lab .row-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;max-width:230px}
#nl-controls-lab label{display:flex;align-items:center;gap:5px}
#nl-controls-lab select{font:inherit;background:var(--p-bg,var(--background));color:var(--p-text,var(--foreground));border:1px solid var(--p-line,var(--border));border-radius:8px;padding:4px;max-width:100%}
#nl-controls-lab .radius-label{width:100%;display:flex;align-items:center}
#nl-controls-lab input[type=range]{width:110px;accent-color:var(--p-accent)}
#nl-controls-lab .capsule{position:relative;display:inline-flex;box-sizing:border-box;padding:3px;gap:3px;background:var(--p-group);border:1px solid transparent;height:var(--control-h);border-radius:var(--control-r);max-width:100%;isolation:isolate}
#nl-controls-lab .capsule.bordered{border-color:var(--p-line)}
#nl-controls-lab .capsule .selection-ink{position:absolute;left:0;top:0;background:var(--p-active);border-radius:var(--inner-r);pointer-events:none;z-index:-1;transition:transform 230ms cubic-bezier(.22,1,.36,1),width 230ms cubic-bezier(.22,1,.36,1),height 230ms cubic-bezier(.22,1,.36,1)}
#nl-controls-lab .capsule button{position:relative;border:0;background:transparent;color:var(--p-muted);font:inherit;font-size:13px;font-weight:400;line-height:18px;padding:0 10px;min-width:0;white-space:nowrap;border-radius:var(--inner-r);display:flex;align-items:center;justify-content:center;gap:6px}
#nl-controls-lab button{cursor:pointer}
#nl-controls-lab button[hidden]{display:none}
#nl-controls-lab .capsule button[aria-pressed=true]{color:var(--p-text)}
#nl-controls-lab button:focus-visible,#nl-controls-lab select:focus-visible{outline:2px solid var(--p-focus);outline-offset:2px}
#nl-controls-lab .main-action{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h);padding:0 20px;border:1px solid transparent;border-radius:var(--control-r);background:var(--p-accent);color:var(--p-on);font:inherit;font-size:14px}
#nl-controls-lab .main-action.bordered{border-color:var(--p-line)}
#nl-controls-lab .main-action.wide{width:100%;min-width:240px}
#nl-controls-lab .row-example:has(.wide){width:100%}
#nl-controls-lab .translation-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--p-active);color:var(--p-text);border:1px solid color-mix(in srgb,var(--p-text) 12%,var(--p-active));border-radius:12px;min-width:140px;padding:5px;box-shadow:0 5px 18px color-mix(in srgb,var(--p-text) 10%,transparent)}
#nl-controls-lab .translation-menu button{display:block;width:100%;border:0;border-radius:8px;text-align:left;background:transparent;color:inherit;font:inherit;font-size:13px;padding:8px 10px}
#nl-controls-lab .translation-menu button:hover{background:var(--p-group)}
#nl-controls-lab output{display:block;min-height:20px;font-size:12px;color:var(--p-muted);margin-top:16px}
@media(max-width:620px){#nl-controls-lab .lab-row{grid-template-columns:1fr}#nl-controls-lab .row-controls{max-width:none}#nl-controls-lab .radius-label{width:auto}#nl-controls-lab .lab-product{padding:14px}}
@media(max-width:380px){#nl-controls-lab .capsule button{padding:0 7px;font-size:12px}#nl-controls-lab .main-action.wide{min-width:0}}
@media(prefers-reduced-motion:reduce){#nl-controls-lab .selection-ink{transition:none!important}}
</style>
<script>
(()=>{
const root=document.getElementById('nl-controls-lab'),rows=root.querySelector('#lab-rows'),product=root.querySelector('.lab-product'),status=root.querySelector('#lab-status');

function ink(g,animate=true){if(!g.marker)return;const selected=g.buttons[g.d.selected??0];g.marker.hidden=!selected;if(!selected)return;const r=selected.getBoundingClientRect(),p=g.preview.getBoundingClientRect();if(!animate)g.marker.style.transition='none';g.marker.style.width=r.width+'px';g.marker.style.height=r.height+'px';g.marker.style.transform=`translate(${r.left-p.left-g.preview.clientLeft}px,${r.top-p.top-g.preview.clientTop}px)`;if(!animate)requestAnimationFrame(()=>g.marker.style.removeProperty('transition'));}
function render(g,animate=false){const d=g.d,h=Number(d.height),radius=h*Number(d.radius)/100;g.preview.style.setProperty('--control-h',h+'px');g.preview.style.setProperty('--control-r',radius+'px');g.preview.style.setProperty('--inner-r',Math.max(0,radius-4)+'px');g.preview.classList.toggle('bordered',d.border);g.preview.classList.toggle('transparent',!d.background);g.preview.classList.toggle('filled',d.background);g.preview.parentElement.style.setProperty('--picker-height',h+'px');g.radiusOutput.textContent=d.radius+'%';if(g.buttons&&!d.library){g.buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===(d.selected??0))));}ink(g,animate);}
for(const d of definitions){const stored=saved[d.id];if(stored){if([28,34,44].includes(Number(stored.height)))d.height=Number(stored.height);if(Number.isFinite(Number(stored.radius)))d.radius=Math.max(0,Math.min(50,Number(stored.radius)));if(typeof stored.border==='boolean')d.border=stored.border;if(typeof stored.background==='boolean')d.background=stored.background;if(d.id==='material')d.singleLanguage=stored.singleLanguage===true;if(d.adaptive){if([1,2,3,4,6].includes(stored.activeCount))d.activeCount=stored.activeCount;d.chosenLanguage=stored.chosenLanguage||'Dutch';d.rememberedLanguage=stored.rememberedLanguage||'Russian';}if(d.items&&Number.isInteger(stored.selected)&&stored.selected>=-1&&stored.selected<d.items.length)d.selected=stored.selected;if((d.translation||d.picker)&&['Russian','English','Dutch','German','French'].includes(stored.language))d.items[d.picker?.index??1]=stored.language;}
if(d.library)d.height=28;
const row=document.createElement('section');row.className='lab-row';row.setAttribute('aria-label',d.label);

if(d.adaptive){const trigger=document.createElement('button');trigger.type='button';trigger.className='picker-trigger';trigger.setAttribute('aria-label','Другие активные языки обучения');trigger.setAttribute('aria-expanded','false');trigger.setAttribute('aria-haspopup','true');const icon=document.createElement('i');icon.dataset.lucide='chevron-down';icon.setAttribute('aria-hidden','true');trigger.append(icon);holder.classList.add('has-picker');holder.append(trigger);g.trigger=trigger;const menu=document.createElement('div');menu.className='translation-menu';menu.hidden=true;holder.append(menu);g.menu=menu;g.adapt=(animate=false)=>{const all=['Dutch','German','English','Russian','Spanish','Italian'].slice(0,d.activeCount);const budget=example.clientWidth;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.font='13px Inter,system-ui,sans-serif';const width=t=>ctx.measureText(t).width+23;let capacity=Math.min(4,all.length);while(capacity>1&&all.slice(0,capacity).reduce((n,t)=>n+width(t),8)+(all.length>capacity?31:0)>budget)capacity--;const overflow=all.length>capacity;let visible=all.slice(0,capacity);if(overflow&&all.includes(d.rememberedLanguage)&&!visible.slice(0,-1).includes(d.rememberedLanguage))visible[capacity-1]=d.rememberedLanguage;if(!all.includes(d.chosenLanguage))d.chosenLanguage=all[0];if(overflow&&!visible.includes(d.chosenLanguage))visible[capacity-1]=d.chosenLanguage;d.items=visible;d.selected=visible.indexOf(d.chosenLanguage);g.buttons.forEach(b=>b.remove());g.buttons=visible.map((language,i)=>{const b=document.createElement('button');b.type='button';b.textContent=language;b.addEventListener('click',()=>{d.chosenLanguage=language;d.selected=i;render(g,true);remember();});preview.append(b);return b;});trigger.hidden=!overflow;menu.replaceChildren();all.filter(l=>!visible.includes(l)).forEach(language=>{const b=document.createElement('button');b.type='button';b.textContent=language;b.addEventListener('click',()=>{d.chosenLanguage=language;d.rememberedLanguage=language;menu.hidden=true;trigger.setAttribute('aria-expanded','false');g.adapt(true);remember();trigger.focus();});menu.append(b);});if(!overflow){menu.hidden=true;trigger.setAttribute('aria-expanded','false');}render(g,animate);};trigger.addEventListener('click',()=>{menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)menu.querySelector('button')?.focus();});row.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();}});document.addEventListener('pointerdown',e=>{if(!holder.contains(e.target)){menu.hidden=true;trigger.setAttribute('aria-expanded','false');}});}
if(d.translation||d.picker){const picker=d.picker||{index:1,label:'Выбрать язык перевода',options:['Russian','English','Dutch','German','French']};const trigger=document.createElement('button');trigger.type='button';trigger.setAttribute('aria-label',picker.label);trigger.className='picker-trigger';trigger.setAttribute('aria-haspopup','true');trigger.setAttribute('aria-expanded','false');const icon=document.createElement('i');icon.dataset.lucide='chevron-down';icon.setAttribute('aria-hidden','true');trigger.append(icon);holder.classList.add('has-picker');holder.append(trigger);g.trigger=trigger;const menu=document.createElement('div');menu.className='translation-menu';menu.hidden=true;holder.append(menu);const close=()=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false');};for(const language of picker.options){const option=document.createElement('button');option.type='button';option.textContent=language;option.addEventListener('click',()=>{d.items[picker.index]=language;g.buttons[picker.index].textContent=language;d.selected=picker.index;close();render(g,true);trigger.focus();status.textContent=d.label+': '+language;remember();});menu.append(option);}trigger.addEventListener('click',()=>{menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)menu.querySelector('button').focus();});row.addEventListener('keydown',e=>{if(e.key==='Escape'){close();trigger.focus();}});document.addEventListener('pointerdown',e=>{if(!holder.contains(e.target))close();});}
const controls=document.createElement('div');controls.className='row-controls';const sizeLabel=document.createElement('label');sizeLabel.append('Высота');const size=document.createElement('select');size.setAttribute('aria-label','Высота · '+d.label);[44,34,28].forEach(h=>{const option=document.createElement('option');option.value=h;option.textContent=h+' px';size.append(option);});size.value=d.height;size.disabled=!!d.library;size.addEventListener('change',()=>{d.height=Number(size.value);render(g);remember();});sizeLabel.append(size);controls.append(sizeLabel);
const borderLabel=document.createElement('label'),border=document.createElement('input');border.type='checkbox';border.checked=d.border;border.setAttribute('aria-label','Рамка · '+d.label);border.addEventListener('change',()=>{d.border=border.checked;render(g);remember();});borderLabel.append(border,'Рамка');controls.append(borderLabel);
if(!d.action){const bgLabel=document.createElement('label'),bg=document.createElement('input');bg.type='checkbox';bg.checked=d.background;bg.setAttribute('aria-label','Фон группы · '+d.label);bg.addEventListener('change',()=>{d.background=bg.checked;render(g);remember();});bgLabel.append(bg,d.library?'Фон действий':'Фон группы');controls.append(bgLabel);}
const radiusLabel=document.createElement('label');radiusLabel.className='radius-label';radiusLabel.append('Радиус');const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=50;slider.step=1;slider.value=d.radius;slider.setAttribute('aria-label','Скругление · '+d.label);g.radiusOutput=document.createElement('span');slider.addEventListener('input',()=>{d.radius=Number(slider.value);render(g);});slider.addEventListener('change',remember);radiusLabel.append(slider,g.radiusOutput);controls.append(radiusLabel);
if(d.id==='material'){const countLabel=document.createElement('label'),count=document.createElement('select');count.setAttribute('aria-label','Доступные языки · Your material');for(const [v,t] of [['3','Несколько языков'],['1','Один язык']]){const o=document.createElement('option');o.value=v;o.textContent=t;count.append(o);}count.value=d.singleLanguage?'1':'3';const applyCount=()=>{d.singleLanguage=count.value==='1';g.buttons[0].textContent=d.singleLanguage?'All · Dutch':'All';g.buttons[0].disabled=d.singleLanguage;g.buttons.slice(1).forEach(b=>b.hidden=d.singleLanguage);g.trigger.hidden=d.singleLanguage;if(d.singleLanguage)d.selected=0;render(g,true);};count.addEventListener('change',()=>{applyCount();remember();});if(d.singleLanguage){g.buttons[0].textContent='All · Dutch';g.buttons[0].disabled=true;g.buttons.slice(1).forEach(b=>b.hidden=true);g.trigger.hidden=true;d.selected=0;}countLabel.append(count);controls.append(countLabel);}
if(d.adaptive){const l=document.createElement('label'),c=document.createElement('select');c.setAttribute('aria-label','Активных языков');[1,2,3,4,6].forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n+' активных';c.append(o);});c.value=d.activeCount;c.addEventListener('change',()=>{d.activeCount=Number(c.value);g.adapt();remember();});l.append(c);controls.append(l);}
row.append(example,controls);rows.append(row);groups.push(g);render(g);if(g.adapt)g.adapt();}
let lastWidth=0;const ro=new ResizeObserver(()=>{const width=root.clientWidth;if(width!==lastWidth){lastWidth=width;groups.forEach(g=>g.adapt?.());}groups.forEach(g=>ink(g,false));});groups.forEach(g=>ro.observe(g.preview));requestAnimationFrame(()=>groups.forEach(g=>ink(g,false)));
root.querySelector('#lab-copy').addEventListener('click',async()=>{const settings={theme:product.dataset.theme,controls:Object.fromEntries(groups.map(({d})=>[d.id,{height:d.height,radiusPercent:d.radius,border:d.border,...(!d.action?{background:d.background}:{}),...(d.adaptive?{activeCount:d.activeCount,pausedLanguagesExcluded:true,order:'settings-order',maxVisible:4,fit:'available-width',rememberedLanguage:d.rememberedLanguage,selected:d.chosenLanguage,chevronBackground:false}:{}),...(d.picker||d.translation?{rememberedLanguage:d.items[d.picker?.index??1],chevronBackground:false,...(d.id==='material'?{currentLanguage:'Dutch',singleLanguage:d.singleLanguage??false}:{})}:{}),...(d.library?{scope:'library-card-only',heightLocked:true}:{}),...(d.items&&!d.library?{selected:d.selected===-1?null:d.items[d.selected??0]}:{})}])),dropdown:{border:'neutral-12-percent',radius:12},ratingButtons:'Again / Hard / Good / Easy: keep unchanged',selectionAnimation:{durationMs:230,dividers:false}};const value=JSON.stringify(settings,null,2),field=root.querySelector('#lab-export');field.value=value;try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(value);field.hidden=true;status.textContent='Настройки скопированы — можно вставить в чат.';}catch{field.hidden=false;field.focus();field.select();let copied=false;try{copied=document.execCommand('copy');}catch{}status.textContent=copied?'Настройки скопированы — можно вставить в чат.':'Настройки выделены — скопируйте их ⌘C / Ctrl+C.';}});

})();
</script>
