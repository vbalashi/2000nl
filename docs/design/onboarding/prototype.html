;
const key='2000nl-issue9-concept-v1';
let state={lang:'en',status:'not-started',view:'ready',revealed:false,learned:0,actionsDone:0,activeTraining:'Dilum NL',collection:'',membership:false,collectionTraining:false,help:false};
try{Object.assign(state,JSON.parse(localStorage.getItem(key)||'{}'))}catch{}
const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=k=>(copy[state.lang][k]||k).replaceAll('{training}','Dilum NL').replaceAll('{dictionary}','Dilum Nederlands');
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function btn(id,label,primary=false){return `<button id="${id}" ${primary?'class="primary"':''}>${esc(label)}</button>`}
function guidance(title,body){return `<aside class="notice" aria-labelledby="guide-title"><h2 id="guide-title">${esc(title)}</h2><p>${esc(body)}</p></aside>`}
function actions(s){return `<div class="actions">${s}</div>`}
function doAction(id,fn){let e=document.getElementById(id);if(e)e.onclick=()=>{fn();save();render();const next={start:'reveal',reveal:'learn',learn:state.view==='done'?'continue':'reveal',pause:'resume',resume:state.revealed?'learn':'reveal',skip:state.view==='ready'?'start':state.revealed?'learn':'reveal',library:'search',collections:state.collection?'member':'name',create:'member',prepare:'collectionStart',collectionStart:'reveal',continue:'reveal',replay:'start',closeHelp:'help'}[id];if(next)document.getElementById(next)?.focus();}}
function render(){
 document.documentElement.lang=state.lang;document.getElementById('language').value=state.lang;document.getElementById('proposal').textContent=t('proposal');document.getElementById('help').textContent=t('help');
 let g=state.status==='active'||state.status==='not-started';let s=`<div class="badge">#9 · ${esc(t('proposal'))}</div>`;
 if(state.help){s+=guidance(t('help'),t('settingsHint'))+actions(btn('replay',t('replay'),true)+btn('closeHelp',t('return')))+`<p class="muted">${esc(t('simulated'))}</p>`;}
 else if(state.view==='ready'){
  if(state.status==='paused')s+=actions(btn('resume',t('resume'),true));
  if(g)s+=guidance(t('readyTitle'),t('readyBody'));
  s+=`<section class="saved"><span class="badge">Dilum Nederlands</span><h1>Dilum NL</h1><p class="training-meta">NL · ${esc(({en:'Words · Direct',nl:'Woorden · Direct',ru:'Слова · Прямой'})[state.lang])}</p><p>${esc(t('simulated'))}</p>${actions(btn('start',t('start'),true)+(g?btn('skip',t('skip')):''))}</section>`;
 }else if(state.view==='card'){
  let word=state.learned%2?'fiets':'bank';let def=word==='bank'?'Een zitplaats voor meerdere mensen.':'Een voertuig met twee wielen waarop je trapt.';let example=word==='bank'?'We zitten samen op de bank.':'Ik fiets naar huis.';
  s+=`<div class="stats"><span>${esc(state.activeTraining)}</span><span>${state.learned} ✓</span></div>`;
  if(g)s+=guidance(t(state.revealed?'answerTitle':'frontTitle'),t(state.revealed?'answerBody':'frontBody'));
  if(state.status==='paused')s+=actions(btn('resume',t('resume')));
  s+=`<section class="card"><h1 class="word">de ${word}</h1>${state.revealed?`<p class="definition">${def}</p><p class="example">${example}</p>`:''}</section>`;
  s+=actions(btn(state.revealed?'learn':'reveal',t(state.revealed?'learn':'reveal'),true));
  if(g)s+=actions(btn('pause',t('pause'))+btn('skip',t('skip')));
 }else if(state.view==='done'){
  s+=guidance(t('doneTitle'),t('doneBody'))+actions(btn('continue',t('continue'),true)+btn('library',t('library')));
 }else if(state.view==='library'){
  s+=guidance(t('collectionTitle'),t('collectionBody'));
  s+=`<label class="field">${esc(({en:'Find a meaning',nl:'Zoek een betekenis',ru:'Найти значение'})[state.lang])}<input id="search" value="bank"></label><section class="card"><h1>de bank</h1><p class="definition">Een zitplaats voor meerdere mensen.</p><p class="example">We zitten samen op de bank.</p>${actions(btn('collections',t('collections'),true))}</section>`+actions(btn('continue',t('return')));
 }else if(state.view==='collections'){
  s+=`<h1 class="screen-heading">${esc(t('collections'))}</h1><p>bank · Een zitplaats voor meerdere mensen.</p>`;
  if(state.collection)s+=`<label class="field"><input style="display:inline;width:auto" type="checkbox" id="member" ${state.membership?'checked':''}> ${esc(state.collection)}</label>`;
  else s+=`<label class="field">${esc(t('collectionName'))}<input id="name" maxlength="160" autocomplete="off"></label>`+actions(btn('create',t('create'),true));
  if(state.membership)s+=`<p role="status">${esc(t('added'))}</p><p>${esc(t('collectionTraining'))}</p>`+actions(btn('prepare',t('start')));
  s+=actions(btn('library',t('library'))+btn('continue',t('return')));
 }else if(state.view==='collection-training'){
  s+=`<h1>${esc(state.collection)}</h1><p>${esc(t('collectionTraining'))}</p><section class="saved"><p>${esc(t('collections'))}: ${esc(state.collection)}</p><p>NL · ${esc(({en:'Words · Direct',nl:'Woorden · Direct',ru:'Слова · Прямой'})[state.lang])}</p>${actions(btn('collectionStart',t('start'),true))}</section>`+actions(btn('continue',t('return')));
 }
 s+=`<div class="status" aria-live="polite">${state.membership?esc(state.collection)+' · 1':''}</div><footer class="simulation">${esc(t('simulated'))}<p><a href="README.md">Design proposal</a> · <a href="audit.md">Current-product evidence</a></p></footer>`;
 app.innerHTML=s;
 doAction('start',()=>{state.view='card';state.activeTraining='Dilum NL';if(state.status==='not-started')state.status='active'});
 doAction('reveal',()=>state.revealed=true);
 doAction('learn',()=>{state.learned++;state.actionsDone++;state.revealed=false;if(state.status==='active'&&state.actionsDone>=2){state.status='completed';state.view='done'}});
 doAction('continue',()=>{state.view='card';state.revealed=false});
 doAction('library',()=>state.view='library');doAction('collections',()=>state.view='collections');
 doAction('skip',()=>{state.status='skipped'});doAction('pause',()=>state.status='paused');doAction('resume',()=>state.status='active');
 doAction('replay',()=>{state.help=false;state.status='active';state.actionsDone=0;state.view='ready'});doAction('closeHelp',()=>state.help=false);
 doAction('create',()=>{let n=document.getElementById('name').value.trim();if(n){state.collection=n;state.membership=true}});
 let member=document.getElementById('member');if(member)member.onchange=()=>{state.membership=member.checked;save();render()};
 doAction('prepare',()=>{state.collectionTraining=true;state.view='collection-training'});doAction('collectionStart',()=>{state.view='card';state.activeTraining=state.collection;state.revealed=false});
 let search=document.getElementById('search');if(search)search.oninput=()=>{let card=app.querySelector('.card');card.hidden=!('bank'.includes(search.value.trim().toLowerCase()))};
}

document.getElementById('help').onclick=()=>{state.help=!state.help;save();render()};render();
